<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP工具演示页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        #counter {
            font-size: 24px;
            font-weight: bold;
            color: #008CBA;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>CDP工具演示页面</h1>
    
    <p>本页面用于演示如何使用CDP命令行工具进行远程调试和查看。</p>
    
    <div class="container">
        <h2>计数器示例</h2>
        <p>点击按钮增加计数器的值：</p>
        <button id="incrementBtn">增加</button>
        <span id="counter">0</span>
    </div>
    
    <div class="container">
        <h2>DOM操作示例</h2>
        <p>点击按钮显示或隐藏元素：</p>
        <button id="toggleBtn">切换显示</button>
        <div id="toggleContent" class="hidden">
            这段内容可以通过JavaScript控制显示和隐藏。
        </div>
    </div>
    
    <div class="container">
        <h2>异步操作示例</h2>
        <p>模拟网络请求：</p>
        <button id="fetchBtn">获取数据</button>
        <div id="fetchResult"></div>
    </div>

    <script src="demo-script.js"></script>
</body>
</html>
